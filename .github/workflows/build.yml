name: Build Android APK

on:
  push:
    branches: [ "main", "experiment/*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Log Build Failure
        if: failure()
        run: |
          echo "### Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post Failure Comment to Commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ERRS=$(grep -E '(^e: |error:|FAILED)' build.log | head -n 40 || true)
          TAIL=$(tail -n 60 build.log)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(echo -e '### Build Failure\n```\nCompiler Errors:\n'"$ERRS"'\n\nLog Tail:\n'"$TAIL"'\n```')" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdShield-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep versionName app/build.gradle.kts | head -n 1 | awk -F'"' '{print $2}')
          TAG="v$VERSION"
          echo "Deploying release for $TAG"
          EXTRA_FLAG=""
          if [ "${{ github.ref_name }}" = "main" ]; then
            EXTRA_FLAG="--latest"
          else
            EXTRA_FLAG="--prerelease"
          fi
          gh release create "$TAG" app/build/outputs/apk/debug/*.apk \
            --title "Fokk Shield $TAG" \
            --notes-file version.json \
            $EXTRA_FLAG || gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
