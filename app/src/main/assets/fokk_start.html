<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fokk Browser</title>
    <style>
        :root {
            --bg-color: #FAF6F5;
            --surface-card: #FFFFFF;
            --card-border: rgba(0, 0, 0, 0.06);
            --fokk-purple: #5B48EE;
            --fokk-cyan: #00B8D9;
            --fokk-blue: #0164FF;
            --text-primary: #191B26;
            --text-secondary: #6B7280;
            --text-muted: #9CA3AF;
            --tile-shadow: 0 4px 16px rgba(0, 0, 0, 0.07);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #11131C;
                --surface-card: #1C1F2E;
                --card-border: rgba(255, 255, 255, 0.08);
                --fokk-purple: #7C6CF6;
                --fokk-cyan: #00E5FF;
                --fokk-blue: #3B82F6;
                --text-primary: #F3F4F6;
                --text-secondary: #9CA3AF;
                --text-muted: #6B7280;
                --tile-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            position: relative;
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: background 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
        }

        body.has-custom-wp::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, rgba(10, 14, 24, 0.2) 0%, rgba(10, 14, 24, 0.5) 50%, rgba(10, 14, 24, 0.8) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        /* 1. CENTERED HERO BRANDING WITH ROUNDED CIRCULAR LOGO */
        .brand-hero-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-top: 24px;
            margin-bottom: 36px;
            cursor: default;
        }

        .brand-logo-disc {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            border: 2px solid var(--card-border);
            flex-shrink: 0;
        }

        .brand-logo-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .brand-title-hero {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            line-height: 1;
        }

        /* 2. FIREFOX-GRADE CIRCULAR SHORTCUTS GRID */
        .shortcuts-grid-firefox {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px 14px;
            margin-bottom: 36px;
        }

        .dial-tile-card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dial-tile-card:hover, .dial-tile-card:active {
            transform: translateY(-3px) scale(1.04);
        }

        .dial-circle-disk {
            position: relative;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--surface-card);
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--tile-shadow);
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .dial-tile-card:hover .dial-circle-disk {
            border-color: var(--fokk-purple);
            box-shadow: 0 8px 24px rgba(91, 72, 238, 0.25);
        }

        .dial-circle-disk svg {
            width: 30px;
            height: 30px;
        }

        .pin-badge-dot {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: rgba(100, 116, 139, 0.7);
            border: 1.5px solid var(--surface-card);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pin-badge-dot svg {
            width: 7px;
            height: 7px;
            fill: #FFFFFF;
        }

        .dial-label-text {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            max-width: 76px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .add-plus-svg {
            width: 24px;
            height: 24px;
            color: var(--text-primary);
            stroke-width: 2.5;
        }

        /* 3. FIREFOX "YOU'RE PROTECTED" PILL CHIP */
        .protection-pill-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--surface-card);
            border: 1px solid var(--card-border);
            border-radius: 9999px;
            padding: 10px 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: auto;
            margin-bottom: 12px;
        }

        .protection-pill-banner:hover {
            transform: scale(1.03);
            border-color: var(--fokk-purple);
            box-shadow: 0 6px 18px rgba(91, 72, 238, 0.2);
        }

        .protection-shield-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--fokk-purple);
        }

        .protection-label {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.1px;
        }

        .protection-stat-badge {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--fokk-purple);
            background: rgba(91, 72, 238, 0.1);
            padding: 2px 7px;
            border-radius: 6px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 16px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface-card);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-close {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--text-primary);
            font-size: 13.5px;
            outline: none;
        }

        .modal-btn {
            background: var(--fokk-purple);
            border: none;
            color: #FFFFFF;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 13.5px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .shortcut-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .shortcut-del-btn {
            background: rgba(239, 68, 68, 0.12);
            border: none;
            color: #EF4444;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .wallpaper-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .wallpaper-card {
            height: 70px;
            border-radius: 12px;
            border: 1.5px solid var(--card-border);
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            transition: all 0.2s ease;
            position: relative;
            background-size: cover;
            background-position: center;
        }

        .wallpaper-card.active {
            border-color: var(--fokk-purple);
            box-shadow: 0 0 12px rgba(91, 72, 238, 0.4);
        }

        .wp-title {
            font-size: 11px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.65);
            color: #fff;
            padding: 2px 6px;
            border-radius: 6px;
            width: fit-content;
        }
    </style>
</head>
<body id="pageBody">

    <div class="main-container">
        <!-- 1. CENTERED HERO BRANDING WITH ROUNDED CIRCULAR LOGO -->
        <div class="brand-hero-center">
            <div class="brand-logo-disc">
                <img src="fokk_logo.png" alt="Fokk Logo" class="brand-logo-img" onerror="this.src='ic_fokk_logo.png'">
            </div>
            <span class="brand-title-hero">Fokk Shield</span>
        </div>

        <!-- 2. FIREFOX-GRADE CIRCULAR SHORTCUTS GRID -->
        <div class="shortcuts-grid-firefox" id="speedDialGrid">
            <!-- Dynamically populated with large circular brand discs -->
        </div>

        <!-- 3. CENTERED "YOU'RE PROTECTED" PILL CHIP -->
        <div class="protection-pill-banner" onclick="openShieldDashboard()">
            <div class="protection-shield-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <span class="protection-label">You’re protected</span>
            <span class="protection-stat-badge" id="statBlockedBadge">0 Requests Filtered</span>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="shortcutsModal" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <div class="modal-title">
                <span>Manage Shortcuts</span>
                <button class="modal-close" onclick="closeShortcutsManager()">✕</button>
            </div>
            <div id="shortcutsManagerList"></div>
            <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px; padding-top:10px; border-top:1px solid var(--card-border);">
                <span style="font-size:12px; font-weight:700; color:var(--fokk-purple);">+ Add New Shortcut</span>
                <input type="text" id="newShortcutTitle" class="modal-input" placeholder="Title (e.g. YouTube)">
                <input type="text" id="newShortcutUrl" class="modal-input" placeholder="URL (e.g. https://m.youtube.com)">
                <button class="modal-btn" onclick="addNewShortcut()">Add Shortcut</button>
            </div>
            <button class="modal-btn" onclick="closeShortcutsManager()" style="background: rgba(0,0,0,0.06); color: var(--text-primary);">Done</button>
        </div>
    </div>

    <div class="modal-overlay" id="themeModal" onclick="closeModalOnBg(event)">
        <div class="modal-card">
            <div class="modal-title">
                <span>Wallpapers &amp; Themes</span>
                <button class="modal-close" onclick="closeThemeModal()">✕</button>
            </div>
            <div class="wallpaper-grid">
                <div class="wallpaper-card active" onclick="setWallpaper('default')" style="background: #FAF6F5; color: #191B26;">
                    <span class="wp-title">Clean Warm</span>
                </div>
                <div class="wallpaper-card" onclick="setWallpaper('pure_obsidian')" style="background: #11131C; color: #fff;">
                    <span class="wp-title">Obsidian Dark</span>
                </div>
                <div class="wallpaper-card" onclick="setWallpaper('twilight_ocean')" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80');">
                    <span class="wp-title">Twilight Ocean</span>
                </div>
                <div class="wallpaper-card" onclick="setWallpaper('aurora')" style="background-image: url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=400&q=80');">
                    <span class="wp-title">Aurora</span>
                </div>
            </div>
            <button class="modal-btn" onclick="closeThemeModal()" style="margin-top: 10px;">Done</button>
        </div>
    </div>

    <script>
        // BRAND SVGS
        const brandSvgs = {
            google: `<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.15z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.24v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.24C.45 8.16 0 9.94 0 12s.45 3.84 1.24 5.41l4.04-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.24 6.59l4.04 3.15c.95-2.84 3.6-4.99 6.72-4.99z"/></svg>`,
            youtube: `<svg viewBox="0 0 24 24"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/><path fill="#FFFFFF" d="m9.545 15.568 6.273-3.568-6.273-3.568z"/></svg>`,
            amazon: `<svg viewBox="0 0 24 24"><path fill="#FF9900" d="M13.62 14.53c-1.74 0-3.16-.4-4.24-1.2-.21-.16-.05-.44.18-.32 1.34.68 2.82.95 4.14.73 1.96-.33 3.65-1.74 4.35-3.64.12-.32.48-.12.39.2-.84 2.45-2.81 4.23-4.82 4.23zm8.01 4.23c-.32.32-.84.21-.95-.2-.53-2.02-2.54-3.56-4.68-3.56-1.57 0-3.04.83-3.8 2.15-.16.27-.47.16-.42-.16.32-1.78 1.94-3.14 3.86-3.14 2.53 0 4.88 1.83 5.49 4.31.05.21-.1.4-.3.6l-.2.01zM2.4 18.77c4.68 3.52 11.23 3.82 16.92.93.35-.18.66.19.34.45-5.32 4.29-12.82 3.86-17.57-.93-.16-.16-.01-.4.21-.35.03-.05.07-.08.1-.1z"/></svg>`,
            wikipedia: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FFFFFF"/><path fill="#111111" d="M12.09 2.91C6.98 2.91 2.84 7.05 2.84 12.16c0 5.11 4.14 9.25 9.25 9.25 5.11 0 9.25-4.14 9.25-9.25 0-5.11-4.14-9.25-9.25-9.25zm5.54 12.88h-1.28l-1.39-4.74-1.39 4.74h-1.28l-2.09-7.22h1.44l1.32 4.96 1.34-4.96h1.36l1.34 4.96 1.32-4.96h1.44l-2.13 7.22z"/></svg>`,
            instagram: `<svg viewBox="0 0 24 24"><defs><linearGradient id="ig-grad" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#FFD600"/><stop offset="25%" stop-color="#FF0040"/><stop offset="60%" stop-color="#D800B9"/><stop offset="100%" stop-color="#7000FF"/></linearGradient></defs><rect width="24" height="24" rx="6" fill="url(#ig-grad)"/><rect x="3.5" y="3.5" width="17" height="17" rx="4.8" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#FFFFFF" stroke-width="1.8"/><circle cx="16.5" cy="7.5" r="1.1" fill="#FFFFFF"/></svg>`,
            reddit: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#FF4500"/><path fill="#FFFFFF" d="M16.5 11a1.5 1.5 0 0 0-1.44 1.09 7.4 7.4 0 0 0-3.06-.65V8.53l1.83.41a1.2 1.2 0 1 0 .28-.9l-2.45-.55a.3.3 0 0 0-.35.23L10.8 11.4a7.4 7.4 0 0 0-3.24.68A1.5 1.5 0 1 0 6 13.5a3.8 3.8 0 0 0 0 .58c0 2.21 2.69 4 6 4s6-1.79 6-4a3.8 3.8 0 0 0 0-.58 1.5 1.5 0 0 0-1.5-2.5zm-6.75 2a.75.75 0 1 1-.75-.75.75.75 0 0 1 .75.75zm4.5 2.25a3.3 3.3 0 0 1-4.5 0 .25.25 0 0 1 .35-.35 2.8 2.8 0 0 0 3.8 0 .25.25 0 0 1 .35.35zm.75-1.5a.75.75 0 1 1 .75-.75.75.75 0 0 1-.75.75z"/></svg>`,
            x: `<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="#000000"/><path fill="#FFFFFF" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>`,
            spotify: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1DB954"/><path fill="#FFFFFF" d="M17.43 15.35a.73.73 0 0 1-1 .24c-2.75-1.68-6.22-2.06-10.3-1.13a.73.73 0 1 1-.33-1.42c4.47-1.02 8.31-.59 11.39 1.3a.73.73 0 0 1 .24 1.01zm1.37-3.05a.91.91 0 0 1-1.25.3c-3.15-1.94-7.95-2.5-11.68-1.37a.91.91 0 1 1-.53-1.74c4.27-1.29 9.56-.67 13.16 1.55a.91.91 0 0 1 .3 1.26zm.12-3.18c-3.78-2.24-10.02-2.45-13.63-1.35a1.09 1.09 0 0 1-.64-2.09c4.17-1.27 11.08-1.02 15.43 1.57a1.09 1.09 0 0 1-1.16 1.87z"/></svg>`
        };

        const defaultDials = [
            { id: "google", title: "Google", url: "https://www.google.com", icon: "google", pinned: true },
            { id: "yt", title: "YouTube", url: "https://m.youtube.com", icon: "youtube", pinned: false },
            { id: "amazon", title: "Amazon", url: "https://www.amazon.com", icon: "amazon", pinned: false },
            { id: "wiki", title: "Wikipedia", url: "https://en.m.wikipedia.org", icon: "wikipedia", pinned: false },
            { id: "instagram", title: "Instagram", url: "https://www.instagram.com", icon: "instagram", pinned: false },
            { id: "reddit", title: "Reddit", url: "https://www.reddit.com", icon: "reddit", pinned: false },
            { id: "x", title: "X", url: "https://x.com", icon: "x", pinned: false },
            { id: "spotify", title: "Spotify", url: "https://open.spotify.com", icon: "spotify", pinned: false }
        ];

        let speedDials = [];

        function loadSpeedDials() {
            try {
                const saved = localStorage.getItem('fokk_speed_dials_v35');
                speedDials = saved ? JSON.parse(saved) : defaultDials;
            } catch (e) {
                speedDials = defaultDials;
            }
            renderSpeedDials();
        }

        function saveSpeedDials() {
            try {
                localStorage.setItem('fokk_speed_dials_v35', JSON.stringify(speedDials));
            } catch (e) {}
        }

        function renderSpeedDials() {
            const grid = document.getElementById('speedDialGrid');
            grid.innerHTML = '';

            speedDials.forEach((dial) => {
                const tile = document.createElement('div');
                tile.className = 'dial-tile-card';
                tile.onclick = () => { window.location.href = dial.url; };

                const pinHtml = dial.pinned ? `
                    <div class="pin-badge-dot">
                        <svg viewBox="0 0 24 24"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>
                    </div>` : '';

                const iconSvg = brandSvgs[dial.icon] || `<svg viewBox="0 0 24 24" fill="var(--fokk-purple)"><circle cx="12" cy="12" r="10"/></svg>`;

                tile.innerHTML = `
                    <div class="dial-circle-disk">
                        ${pinHtml}
                        ${iconSvg}
                    </div>
                    <span class="dial-label-text">${dial.title}</span>
                `;
                grid.appendChild(tile);
            });

            // Plus Disk ("Add shortcut" tile matching Firefox)
            const addTile = document.createElement('div');
            addTile.className = 'dial-tile-card';
            addTile.onclick = openShortcutsManager;
            addTile.innerHTML = `
                <div class="dial-circle-disk">
                    <svg class="add-plus-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </div>
                <span class="dial-label-text">Add short...</span>
            `;
            grid.appendChild(addTile);
        }

        function openShortcutsManager() {
            renderShortcutsManagerList();
            document.getElementById('shortcutsModal').classList.add('active');
        }

        function closeShortcutsManager() {
            document.getElementById('shortcutsModal').classList.remove('active');
        }

        function renderShortcutsManagerList() {
            const list = document.getElementById('shortcutsManagerList');
            list.innerHTML = '';
            speedDials.forEach((dial, idx) => {
                const row = document.createElement('div');
                row.className = 'shortcut-item-row';
                row.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:13px; color:var(--text-primary);">${dial.title}</div>
                        <div style="font-size:11px; color:var(--text-secondary); max-width:200px; overflow:hidden; text-overflow:ellipsis;">${dial.url}</div>
                    </div>
                    <button class="shortcut-del-btn" onclick="removeShortcut(${idx})">Remove</button>
                `;
                list.appendChild(row);
            });
        }

        function removeShortcut(idx) {
            speedDials.splice(idx, 1);
            saveSpeedDials();
            renderSpeedDials();
            renderShortcutsManagerList();
        }

        function addNewShortcut() {
            const title = document.getElementById('newShortcutTitle').value.trim();
            let url = document.getElementById('newShortcutUrl').value.trim();
            if (!title || !url) return;
            if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;

            let icon = 'generic';
            if (url.includes('google.com')) icon = 'google';
            else if (url.includes('youtube.com') || url.includes('youtu.be')) icon = 'youtube';
            else if (url.includes('amazon.')) icon = 'amazon';
            else if (url.includes('wikipedia.')) icon = 'wikipedia';
            else if (url.includes('instagram.')) icon = 'instagram';
            else if (url.includes('reddit.')) icon = 'reddit';
            else if (url.includes('x.com') || url.includes('twitter.')) icon = 'x';
            else if (url.includes('spotify.')) icon = 'spotify';

            speedDials.push({ id: 'c_' + Date.now(), title, url, icon, pinned: false });
            saveSpeedDials();
            renderSpeedDials();
            renderShortcutsManagerList();
            document.getElementById('newShortcutTitle').value = '';
            document.getElementById('newShortcutUrl').value = '';
        }

        function openThemeModal() {
            document.getElementById('themeModal').classList.add('active');
        }

        function closeThemeModal() {
            document.getElementById('themeModal').classList.remove('active');
        }

        function closeModalOnBg(e) {
            if (e.target.classList.contains('modal-overlay')) {
                e.target.classList.remove('active');
            }
        }

        function setWallpaper(type) {
            const body = document.getElementById('pageBody');
            body.classList.remove('has-custom-wp');
            if (type === 'default') {
                body.style.backgroundImage = 'none';
                body.style.backgroundColor = 'var(--bg-color)';
            } else if (type === 'pure_obsidian') {
                body.style.backgroundImage = 'none';
                body.style.backgroundColor = '#11131C';
            } else if (type === 'twilight_ocean') {
                body.classList.add('has-custom-wp');
                body.style.backgroundImage = "url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1200&q=85')";
            } else if (type === 'aurora') {
                body.classList.add('has-custom-wp');
                body.style.backgroundImage = "url('https://images.unsplash.com/photo-1531366936337-7c912a4589a7?auto=format&fit=crop&w=1200&q=85')";
            }
            document.querySelectorAll('.wallpaper-card').forEach(c => c.classList.remove('active'));
            const matched = document.querySelector(`.wallpaper-card[onclick*="'${type}'"]`);
            if (matched) matched.classList.add('active');
        }

        function openShieldDashboard() {
            if (window.FokkShieldBridge && typeof window.FokkShieldBridge.openShieldDashboard === 'function') {
                window.FokkShieldBridge.openShieldDashboard();
            }
        }

        loadSpeedDials();

        // Sync Live Stats from Android Bridge
        try {
            if (window.FokkShieldBridge && typeof window.FokkShieldBridge.getStats === 'function') {
                const stats = JSON.parse(window.FokkShieldBridge.getStats());
                if (stats.blocked) {
                    document.getElementById('statBlockedBadge').innerText = Number(stats.blocked).toLocaleString() + " Requests Filtered";
                }
            }
        } catch (e) {}
    </script>
</body>
</html>
